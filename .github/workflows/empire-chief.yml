name: Empire OS - Chief Autonomous Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: '17 15 * * *'

permissions:
  contents: write

jobs:
  chief-daily-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    
      - name: Get Empire OS files
        uses: actions/checkout@v4
      - name: Test Empire OS development engine
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Scout researches opportunities
        run: python3 scout.py
      - name: Deal Hunter researches business and careers
        run: python3 deal_hunter.py

      - name: Empire OS monitors workers and proposes upgrades
        run: python3 empire_engine.py
  
      - name: Chief begins operations
        run: |
          echo "EMPIRE OS - CHIEF ONLINE"
          echo "UTC: $(date -u)"
          echo "Mission 1: Contract opportunities"
          echo "Mission 2: Revenue opportunities"
          echo "Mission 3: AI business services"
          echo "Scheduler test successful"
          echo "No money spent and no external actions taken"

      - name: Create operations report
        run: |
          mkdir -p reports
          {
            echo "# Empire OS - Chief Report"
            echo "Run time: $(date -u)"
            echo ""
            echo "Scheduler: Operational"
            echo "Contract research: Not yet connected"
            echo "Revenue research: Not yet connected"
            echo "AI services: Not yet connected"
            echo "Spending: Disabled"
          } > reports/chief-report.md

      - name: Save report
        uses: actions/upload-artifact@v4
        with:
          name: chief-operations-report
          
          
          path: |
            reports/chief-report.md
            reports/scout-report.md
            reports/radar-report.md
            reports/deal-hunter-report.md
            reports/career-elevator-report.md
            reports/grant-hunter-report.md

            reports/empire-status.json
            reports/development-review.md


      - name: Publish dashboard status
        run: |
          mkdir -p status
          cp reports/empire-status.json status/empire-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/empire-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Empire OS dashboard status"
            git push
          fi
  
